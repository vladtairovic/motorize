services:
  db:
    image: postgis/postgis:16-3.4
    container_name: motorize-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: motorize
      POSTGRES_PASSWORD: motorize
      POSTGRES_DB: motorize
    ports:
      - "5432:5432"
    volumes:
      - motorize_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motorize"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Produção: API + front-ends estáticos atrás de proxy reverso.
  api:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgres://motorize:motorize@db:5432/motorize
    ports:
      - "3333:3333"
    volumes:
      - motorize_storage:/app/apps/api/storage

volumes:
  motorize_pgdata:
  motorize_storage:
